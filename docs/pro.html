<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get github-actions-setup Supporter</title>
<meta name="description" content="Checkout for github-actions-setup paid tiers.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root {
    --bg: #0b0d12; --bg-card: #12141c; --bg-card-hover: #171a24; --border: #22252f;
    --text: #e8e9ed; --text-dim: #9a9ea8;
    --blue: #5b8cff; --orange: #ff8a5b; --green: #3ecf8e;
    scroll-behavior: smooth;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  a { color: var(--blue); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 100px 24px; }
  /* Was a plain dim text link - now a real button so "go back to pricing"
     reads as a clear, tappable action rather than incidental page furniture. */
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 28px; padding: 9px 16px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg-card); color: var(--text);
    font-size: 14px; font-weight: 600; text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .back:hover { background: var(--bg-card-hover); border-color: var(--blue); text-decoration: none; }
  @media (max-width: 600px) {
    .wrap { padding: 56px 20px; } /* 100px top padding was excessive once the viewport itself is short */
  }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font-weight: 700; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px;
  }
  .tier-label { font-size: 13px; color: var(--text-dim); margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tier-name { font-size: 26px; font-weight: 700; margin: 0 0 4px; }
  .tier-price { font-size: 18px; color: var(--blue); margin: 0 0 20px; }
  ul.included { list-style: none; padding: 0; margin: 0 0 28px; display: grid; gap: 10px; }
  ul.included li { font-size: 14px; color: var(--text-dim); display: flex; gap: 8px; }
  ul.included li::before { content: "✓"; color: var(--green); flex-shrink: 0; }
  .btn {
    display: block; width: 100%; text-align: center; padding: 13px;
    border-radius: 8px; font-weight: 600; font-size: 14px; border: 1px solid var(--border);
    background: var(--blue); color: #06070b; text-decoration: none; cursor: pointer;
  }
  .btn:hover { opacity: 0.9; }
  .note { font-size: 13px; color: var(--text-dim); margin-top: 16px; text-align: center; }
  #waitlist-form { display: none; margin-top: 20px; }
  #waitlist-form input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #05060a; color: var(--text); font-size: 14px; margin-bottom: 12px;
  }
  #waitlist-confirm { display: none; text-align: center; padding: 20px 0; color: var(--green); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html#pricing">← Back to pricing</a>
  <div class="logo-row"><img src="assets/logo.png" alt="" style="width:24px;height:24px;border-radius:6px;"> github-actions-setup</div>

  <div class="card">
    <p class="tier-label" id="tier-label">Supporter</p>
    <p class="tier-name" id="tier-name">Supporter</p>
    <p class="tier-price" id="tier-price">$1.99 / month</p>
    <ul class="included" id="tier-features"></ul>

    <a class="btn" id="checkout-btn" href="#">Continue to checkout</a>
    <p class="note" id="checkout-note"></p>

    <form id="waitlist-form">
      <input type="email" id="waitlist-email" placeholder="you@example.com" required>
      <button type="submit" class="btn" style="border:none;">Join the waitlist</button>
    </form>
    <div id="waitlist-confirm">Thanks — you're on the list. We'll email you the moment this tier goes live.</div>
  </div>
</div>

<script>
  // Fill in a real Gumroad (or Stripe) checkout/membership URL here once the
  // Supporter product exists. Leave empty and the page falls back to a
  // waitlist capture instead of a dead link, so this never 404s regardless
  // of setup status. When the draft tiers below relaunch, this can point
  // at a single membership product with a version per tier.
  const CHECKOUT_URL = "";

  const TIERS = {
    supporter: {
      name: "Supporter", price: "$1.99 / month",
      features: [
        "Everything in the free OSS core",
        "Priority email support",
        "Early access to new deploy templates",
      ],
    },

    /* Draft tiers — built and tested, held back until the project has a
       real user base (see the matching commented-out cards in index.html).
       Uncomment here plus there to relaunch them.

    builder: {
      name: "Builder", price: "$4.77 / month",
      features: [
        "Everything in Supporter",
        "Google Cloud Run deploy (OIDC)",
        "Docker / GHCR multi-arch builds",
      ],
    },
    shipper: {
      name: "Shipper", price: "$7.77 / month",
      features: [
        "Everything in Builder",
        "Staging → production promotion",
        "Slack deploy notifications",
      ],
    },
    pro: {
      name: "Pro", price: "$9.77 / month",
      features: [
        "Everything in Shipper",
        "Custom deploy target requests",
        "1:1 setup call (30 min)",
      ],
    },
    */
  };

  const params = new URLSearchParams(window.location.search);
  const tierId = TIERS[params.get("tier")] ? params.get("tier") : "supporter";
  const tier = TIERS[tierId];

  document.getElementById("tier-label").textContent = tierId;
  document.getElementById("tier-name").textContent = tier.name;
  document.getElementById("tier-price").textContent = tier.price;
  document.getElementById("tier-features").innerHTML =
    tier.features.map(f => `<li>${f}</li>`).join("");

  const checkoutBtn = document.getElementById("checkout-btn");
  const checkoutNote = document.getElementById("checkout-note");
  const waitlistForm = document.getElementById("waitlist-form");

  if (CHECKOUT_URL) {
    checkoutBtn.href = CHECKOUT_URL;
    checkoutBtn.target = "_blank";
    checkoutNote.textContent = "Opens secure checkout in a new tab.";
  } else {
    checkoutBtn.style.display = "none";
    checkoutNote.textContent = "Pro checkout isn't live yet — join the waitlist below and we'll email you the moment it is.";
    waitlistForm.style.display = "block";
  }

  waitlistForm.addEventListener("submit", function (e) {
    e.preventDefault();
    const email = document.getElementById("waitlist-email").value;
    const subject = encodeURIComponent(`Pro waitlist — ${tier.name}`);
    const body = encodeURIComponent(`Please add me to the waitlist for the ${tier.name} tier ($${tier.price}).\n\nEmail: ${email}`);
    window.location.href = `mailto:sophimphath98@gmail.com?subject=${subject}&body=${body}`;
    waitlistForm.style.display = "none";
    document.getElementById("waitlist-confirm").style.display = "block";
  });
</script>
</body>
</html>
