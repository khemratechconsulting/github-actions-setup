# Test + deploy to any server you can SSH into (a VPS, a bare EC2 instance,
# an on-prem box). Assumes the server already has the repo cloned and a
# process manager (pm2 here — swap for systemd/docker as needed).
#
# Required repo secrets:
#   SERVER_HOST     - IP or hostname
#   SERVER_USER     - SSH user
#   SERVER_SSH_KEY  - private key with access to that user (generate a
#                     dedicated deploy key, don't reuse a personal key)
#   SERVER_PORT     - optional, defaults to 22

name: CI/CD - Generic Server (SSH)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm test --if-present

  deploy:
    name: Deploy via SSH
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/${{ github.event.repository.name }}
            git pull origin main
            npm ci --omit=dev
            npm run build --if-present
            pm2 restart ${{ github.event.repository.name }} || pm2 start npm --name "${{ github.event.repository.name }}" -- start
